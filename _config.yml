# Palvast website (GitHub Pages, Jekyll)
title: Palvast
url: "https://palvast.com"
baseurl: ""

# Show the small consent notice (bottom-left). Set to false to remove it everywhere.
consent_banner: true

# Raise this number whenever you add, remove or change an optional service (for example analytics).
# Everyone is then asked again, and nothing optional runs until they choose.
# Also update the consent text in _data/nl.yml and _data/en.yml, and the privacy statement.
consent_version: 1

# Files that live in the repo but are not part of the site
exclude:
  - README.md
  - handoff.md
  - Gemfile
  - Gemfile.lock

# Every page under /nl/ and /en/ gets the shared layout and its language
defaults:
  - scope:
      path: "nl"
    values:
      layout: default
      lang: nl
      contact_cta: true
  - scope:
      path: "en"
    values:
      layout: default
      lang: en
      contact_cta: true
